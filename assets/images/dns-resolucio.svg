<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" font-family="Arial, Helvetica, sans-serif">
  <!-- Resolució DNS: client -> resolutor -> arrel -> TLD -> autoritatiu -->
  <defs>
    <marker id="fletxa" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a6270"/>
    </marker>
  </defs>
  <rect width="680" height="330" fill="#ffffff"/>
  <text x="340" y="28" font-size="20" text-anchor="middle" fill="#1f4e79" font-weight="bold">Què passa quan busquem www.example.com</text>

  <!-- Caixes -->
  <g font-size="14" text-anchor="middle">
    <rect x="20" y="130" width="120" height="60" rx="6" fill="#dbe8f5" stroke="#1f4e79"/>
    <text x="80" y="156" fill="#1f4e79" font-weight="bold">El nostre PC</text>
    <text x="80" y="174" fill="#1f4e79" font-size="12">(client)</text>

    <rect x="210" y="130" width="140" height="60" rx="6" fill="#dff1e6" stroke="#2e8b57"/>
    <text x="280" y="156" fill="#2e8b57" font-weight="bold">Resolutor DNS</text>
    <text x="280" y="174" fill="#2e8b57" font-size="12">(router, ISP, 8.8.8.8)</text>

    <rect x="480" y="50" width="180" height="50" rx="6" fill="#fdebd3" stroke="#e69500"/>
    <text x="570" y="80" fill="#b36b00" font-weight="bold">Servidor arrel ( . )</text>

    <rect x="480" y="135" width="180" height="50" rx="6" fill="#fdebd3" stroke="#e69500"/>
    <text x="570" y="165" fill="#b36b00" font-weight="bold">Servidor TLD ( .com )</text>

    <rect x="480" y="220" width="180" height="50" rx="6" fill="#fdebd3" stroke="#e69500"/>
    <text x="570" y="243" fill="#b36b00" font-weight="bold">Servidor autoritatiu</text>
    <text x="570" y="260" fill="#b36b00" font-size="12">(example.com)</text>
  </g>

  <!-- Fletxes -->
  <g stroke="#5a6270" stroke-width="2" marker-end="url(#fletxa)">
    <line x1="140" y1="150" x2="208" y2="150"/>
    <line x1="350" y1="145" x2="478" y2="80"/>
    <line x1="350" y1="160" x2="478" y2="160"/>
    <line x1="350" y1="175" x2="478" y2="240"/>
    <line x1="208" y1="178" x2="142" y2="178"/>
  </g>

  <g font-size="12" fill="#333">
    <text x="146" y="143">1. pregunta</text>
    <text x="146" y="198">5. resposta (IP)</text>
    <text x="380" y="100">2</text>
    <text x="410" y="154">3</text>
    <text x="380" y="222">4</text>
  </g>

  <text x="340" y="305" font-size="13" text-anchor="middle" fill="#5a6270">El resolutor guarda la resposta en memòria cau (TTL) per no haver de repetir tot el camí.</text>
</svg>
